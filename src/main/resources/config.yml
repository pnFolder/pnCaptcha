# =============================================================================
# pnCaptcha — полная конфигурация
# =============================================================================
# Этот файл одновременно является конфигом и встроенной документацией.
# Любая новая возможность должна быть понятна прямо отсюда: что она делает,
# какие значения принимает и как выглядит рабочий пример.
#
# ВАЖНО:
# - После изменения config.yml полностью перезапусти Velocity.
# - При несовместимом config-version pnCaptcha сохраняет старый файл как backup
#   и создаёт новый config.yml со всеми актуальными комментариями.
# - Minecraft-блоки и звуки указываются через namespace:
#     minecraft:polished_deepslate
#     minecraft:entity.player.levelup
# - MiniMessage поддерживается в messages.* и текстовых Actions.
#
# Основные placeholders Actions:
#   {player}    — ник игрока
#   {uuid}      — UUID игрока
#   {ip}        — IP игрока
#   {online}    — текущий онлайн Velocity
#   {attempt}   — использовано неверных попыток
#   {max}       — максимум попыток
#   {remaining} — сколько попыток осталось
#   {timeout}   — общий timeout CAPTCHA в секундах
#   {reason}    — причина события
#   {server}    — выбранный backend
#   {captcha}   — текущий ответ CAPTCHA; не показывай обычным игрокам
#
# BossBar placeholders:
#   {bossbar_progress} — 0.000..1.000
#   {bossbar_percent}  — 0..100
#   {bossbar_seconds}  — секунд до конца анимации
#   {bossbar_millis}   — миллисекунд до конца анимации
#
# -----------------------------------------------------------------------------
# БЫСТРЫЙ ОТКАТ ВИЗУАЛА К БОЛЕЕ СТАРОМУ ПЛОТНОМУ СТИЛЮ
# -----------------------------------------------------------------------------
# Если новый mosaic-стиль не подходит, не нужно менять код. Достаточно:
#   font.preset: "classic-5x7"
#   scene.distance-blocks: 30.0
#   scene.rotation.yaw-degrees: 28.0
#   geometry.pixel-width: 2
#   geometry.pixel-height: 2
#   geometry.depth-blocks: 3
#   geometry.fill.mode: "solid"
#   palette.mode: "per-block"
# =============================================================================
config-version: 3

# =============================================================================
# ОБЩАЯ ЛОГИКА CAPTCHA
# =============================================================================
general:
  # Количество символов. Допустимо: 3..12.
  # Пример: 5 -> "K7M2P".
  captcha-length: 5

  # Неверных ответов до exhausted. Допустимо: 1..20.
  max-attempts: 3

  # Общий timeout Limbo в секундах. Допустимо: 5..600.
  timeout-seconds: 30

  # Сколько минут помнить успешно проверенную пару UUID+IP.
  # 720 = 12 часов.
  verified-cache-minutes: 720

  input:
    # true -> регистр важен; false -> aBc12 равно ABC12.
    case-sensitive: false

    # Удалять пробелы по краям ответа.
    trim: true

    # Удалять пробелы внутри ответа: "A B C" -> "ABC".
    remove-spaces: true

    # Сообщения длиннее этого значения не считаются ответом CAPTCHA.
    max-length: 32

# =============================================================================
# МАРШРУТИЗАЦИЯ ПОСЛЕ ПРОВЕРКИ
# =============================================================================
routing:
  # priority | least-players | random | weighted-random | round-robin | first-available
  strategy: "least-players"

  # Общий лимит сети. 0 = не ограничивать.
  network-max-players: 0

  # Резерв внутри общего лимита.
  network-reserve-slots: 0

  # Permission для использования зарезервированных мест.
  full-bypass-permission: "pncaptcha.full.bypass"

  # true = при отсутствии подходящего сервера из списка разрешить любой
  # RegisteredServer из velocity.toml.
  fallback-to-any-registered: false

  servers:
    - name: "lobby"
      enabled: true
      priority: 10
      weight: 5
      max-players: 0
      reserve-slots: 0

    # Пример второго lobby:
    # - name: "lobby-2"
    #   enabled: true
    #   priority: 10
    #   weight: 5
    #   max-players: 150
    #   reserve-slots: 5

# =============================================================================
# ЗАЩИТА ОТ СПАМА ПОДКЛЮЧЕНИЙ
# =============================================================================
security:
  # Сколько новых входов с одного IP разрешено внутри окна ниже.
  max-joins-per-window: 6

  # Размер окна rate-limit в секундах.
  join-window-seconds: 10

  # Максимум одновременно существующих персональных CAPTCHA VirtualWorld.
  max-active-captchas: 128

  # Игрок с permission полностью пропускает CAPTCHA.
  bypass-permission: "pncaptcha.bypass"

# =============================================================================
# BSTATS
# =============================================================================
metrics:
  # Локальный переключатель метрик pnCaptcha.
  # Глобальный plugins/bStats/config.txt всё равно имеет приоритет.
  enabled: true

  # Агрегированные custom charts. IP/UUID/ответы CAPTCHA не отправляются.
  custom-charts: true

# =============================================================================
# ОБНОВЛЕНИЯ
# =============================================================================
updates:
  enabled: true
  check-on-startup: true
  startup-delay-seconds: 2
  repository: "pnFolder/pnCaptcha"
  request-timeout-seconds: 5
  notify-console: true
  notify-players: true
  notify-permission: "pncaptcha.admin"
  announce-up-to-date: true

# =============================================================================
# LIMBO WORLD
# =============================================================================
limbo:
  # Базовая view distance. Для далёкой mosaic CAPTCHA auto-expand обычно
  # автоматически поднимет фактическое значение.
  view-distance: 10

  simulation-distance: 8

  # Автоматически расширять view distance по фактическим границам объекта.
  auto-expand-view-distance: true

  # Максимум автоматического расширения. Допустимо 2..32.
  max-auto-view-distance: 16

  # Дополнительные чанки вокруг CAPTCHA, создаваемые до входа игрока.
  precreate-padding-chunks: 1

  reduced-debug-info: false

  # 0 = рассвет, 6000 = день, 12000 = закат, 18000 = ночь.
  world-time-ticks: 6000

  # Разрешить реальное падение. Recovery также использует движение игрока.
  falling-enabled: true

  light:
    sky: 15
    block: 15

  pedestal:
    enabled: true
    block: "minecraft:deepslate_tiles"
    size-x: 1
    size-z: 1
    y-offset: -1

# =============================================================================
# ИГРОК, SPAWN, КАМЕРА И RECOVERY
# =============================================================================
player:
  # creative | adventure | survival | spectator
  game-mode: "creative"

  # true = ограничивать перемещение вокруг spawn.
  lock-position: false
  lock-radius-blocks: 1.5

  spawn:
    x: 0.5
    y: 65.0
    z: 0.5

  camera:
    # true = автоматически смотреть в центр CAPTCHA.
    auto-aim: true
    yaw-degrees: 0.0
    pitch-degrees: 0.0
    yaw-offset-degrees: 0.0
    pitch-offset-degrees: 0.0

  recovery:
    enabled: true
    below-spawn-blocks: 8.0
    above-spawn-blocks: 40.0
    max-horizontal-distance-blocks: 48.0
    cooldown-millis: 500
    preserve-current-look: false
    send-message: true

# =============================================================================
# ПОЛОЖЕНИЕ И УГОЛ ВСЕЙ 3D CAPTCHA
# =============================================================================
scene:
  # Mosaic-стиль расположен дальше старого пресета. Это позволяет сделать
  # символы крупными и детализированными, но целиком оставить строку в кадре.
  # Рекомендуемый диапазон для reference-style: 36..48.
  distance-blocks: 42.0

  # Направление от игрока: 0=+Z, 90=-X, -90=+X, 180=-Z.
  forward-yaw-degrees: 0.0

  # Боковой сдвиг всей строки.
  lateral-offset-blocks: 0.0

  # Высота центра относительно spawn игрока.
  center-height-blocks: 7.0

  rotation:
    # Небольшой общий yaw сохраняет 3D-глубину, но не превращает буквы
    # в сильно диагональный объект. Для старого ракурса можно вернуть 28.
    yaw-degrees: 8.0
    pitch-degrees: 0.0
    roll-degrees: 0.0

# =============================================================================
# ШРИФТ
# =============================================================================
font:
  # Доступно:
  #   ornate-9x12 — новый крупный декоративный шрифт с более сложными формами
  #                 и засечками; рассчитан на mosaic/porous стиль.
  #   classic-5x7 — прежний компактный читаемый bitmap-шрифт.
  #   custom      — собственные glyph из custom-glyphs.
  preset: "ornate-9x12"

  # Исключены визуально похожие 0/O и 1/I/L.
  alphabet: "ABCDEFGHJKMNPQRSTUVWXYZ23456789"

  # Используется только при preset: custom.
  # Все glyph обязаны иметь одинаковую ширину и высоту.
  # 1 = voxel есть, 0 = пустое место.
  custom-glyphs: {}

  # Пример:
  # custom-glyphs:
  #   A:
  #     - "01110"
  #     - "10001"
  #     - "11111"
  #     - "10001"

# =============================================================================
# ГЕОМЕТРИЯ VOXEL-СИМВОЛОВ
# =============================================================================
geometry:
  # ornate-9x12 уже детализированный, поэтому 1x1 сохраняет тонкие элементы.
  # Для classic-5x7 прежний массивный вид можно получить 2x2.
  pixel-width: 1
  pixel-height: 1

  # Реальная 3D-глубина. Reference-style рассчитан примерно на 3..5.
  depth-blocks: 4

  # Передний / задний слои; промежуток использует palette.side.
  front-thickness-blocks: 1
  back-thickness-blocks: 1

  letter-gap-blocks: 2
  letter-rise-blocks: 0.0
  letter-depth-step-blocks: 0.0
  center-text: true
  mirror-horizontal: false
  mirror-vertical: false
  extrude-toward-camera: false

  # ---------------------------------------------------------------------------
  # POROUS FILL — КОНТРОЛИРУЕМЫЕ ПУСТОТЫ ВНУТРИ СИМВОЛОВ
  # ---------------------------------------------------------------------------
  fill:
    # solid  = не удалять элементы шрифта.
    # porous = часть voxel-поверхности удаляется, создавая рваную/сетчатую форму.
    mode: "porous"

    # Какую долю поверхности примерно оставить: 0.35..1.0.
    # 0.78 означает около 78% сохранённых voxel. Алгоритм может оставить больше,
    # если дальнейшее удаление разрушило бы связность символа.
    density: 0.78

    # true = перед удалением проверять, что символ не распался на дополнительные
    # несвязанные куски. Рекомендуется всегда оставлять true для production.
    preserve-connectivity: true

    # true = не удалять концевые точки штрихов; помогает сохранять форму цифр/букв.
    protect-endpoints: true

    # Насколько агрессивно беречь внешний контур от прореживания, 0..100.
    # Чем выше число, тем плотнее силуэт и тем больше пустот останется внутри.
    outline-preserve-percent: 78.0

    # Абсолютный минимум элементов поверхности, который должен остаться у glyph.
    # Защита для небольших custom-font символов.
    min-retained-pixels: 14

# =============================================================================
# РАНДОМНОСТЬ
# =============================================================================
randomness:
  enabled: true
  seed-mode: "random" # random | fixed
  fixed-seed: 1337

  character:
    # Reference-style держит буквы почти в одной строке. Сложность создаётся
    # пустотами и материалами, а не сильным разбросом символов.
    horizontal-jitter-blocks: 0
    vertical-jitter-blocks: 0
    depth-jitter-blocks: 0
    depth-variation-blocks: 0

    # Лёгкие индивидуальные углы не дают строке выглядеть идеально машинной.
    rotation-yaw-jitter-degrees: 1.5
    rotation-pitch-jitter-degrees: 0.75
    rotation-roll-jitter-degrees: 0.5

  scene:
    distance-jitter-blocks: 0.0
    height-jitter-blocks: 0.0
    lateral-jitter-blocks: 0.0
    forward-yaw-jitter-degrees: 0.0
    rotation-yaw-jitter-degrees: 1.0
    rotation-pitch-jitter-degrees: 0.0
    rotation-roll-jitter-degrees: 0.0

# =============================================================================
# ПАЛИТРА MOSAIC
# =============================================================================
palette:
  # Доступно:
  #   clustered     — новый режим: соседние voxel получают общий материал
  #                   небольшими пятнами/кластерами, как на reference.
  #   per-block     — каждый voxel выбирается независимо.
  #   per-character — один материал стабильнее внутри буквы.
  #   solid         — всегда первый материал группы.
  mode: "clustered"

  # Размер цветовых пятен в clustered mode. Для каждой буквы выбирается
  # случайный размер внутри диапазона.
  cluster-size-min: 2
  cluster-size-max: 5

  # Передняя поверхность. Stained glass даёт реальную ванильную прозрачность;
  # произвольный numeric alpha Minecraft-блоки не поддерживают.
  front:
    - block: "minecraft:cyan_stained_glass"
      weight: 4
    - block: "minecraft:light_blue_stained_glass"
      weight: 4
    - block: "minecraft:blue_stained_glass"
      weight: 3
    - block: "minecraft:gray_stained_glass"
      weight: 3
    - block: "minecraft:cyan_terracotta"
      weight: 3
    - block: "minecraft:light_blue_terracotta"
      weight: 2
    - block: "minecraft:weathered_cut_copper"
      weight: 2
    - block: "minecraft:oxidized_cut_copper"
      weight: 2
    - block: "minecraft:polished_deepslate"
      weight: 3

  # Боковые грани намеренно темнее — это подчёркивает настоящую 3D-толщину.
  side:
    - block: "minecraft:deepslate_tiles"
      weight: 5
    - block: "minecraft:polished_deepslate"
      weight: 4
    - block: "minecraft:blackstone"
      weight: 3
    - block: "minecraft:gray_stained_glass"
      weight: 2
    - block: "minecraft:oxidized_cut_copper"
      weight: 1

  back:
    - block: "minecraft:blackstone"
      weight: 5
    - block: "minecraft:polished_blackstone"
      weight: 3
    - block: "minecraft:deepslate_tiles"
      weight: 2

  accent:
    # Редкие тёплые/медные точки внутри основной поверхности.
    enabled: true
    chance-percent: 5.0
    materials:
      - block: "minecraft:cut_copper"
        weight: 2
      - block: "minecraft:weathered_cut_copper"
        weight: 2
      - block: "minecraft:oxidized_cut_copper"
        weight: 1

  outline:
    # Новый отдельный тёмный контур. Он применяется только к передней поверхности
    # по внешним границам исходного glyph и помогает читать porous-символы.
    enabled: true

    # Вероятность использовать outline-палитру на подходящем граничном voxel.
    chance-percent: 86.0

    materials:
      - block: "minecraft:polished_deepslate"
        weight: 5
      - block: "minecraft:deepslate_tiles"
        weight: 4
      - block: "minecraft:blackstone"
        weight: 3
      - block: "minecraft:gray_stained_glass"
        weight: 2

# =============================================================================
# ВИЗУАЛЬНЫЕ ПОМЕХИ
# =============================================================================
noise:
  # Небольшое количество независимых прозрачных кластеров вокруг/за строкой.
  enabled: true
  count: 5
  cluster-size-min: 1
  cluster-size-max: 2
  horizontal-padding-blocks: 4
  vertical-padding-blocks: 3
  depth-min-blocks: 3
  depth-max-blocks: 7

  materials:
    - block: "minecraft:gray_stained_glass"
      weight: 5
    - block: "minecraft:light_blue_stained_glass"
      weight: 3
    - block: "minecraft:cyan_stained_glass"
      weight: 2
    - block: "minecraft:blue_stained_glass"
      weight: 1

# =============================================================================
# ACTIONS — КОНСТРУКТОР РЕАКЦИЙ
# =============================================================================
# TRIGGERS:
#   challenge-start, wrong-answer, passed, exhausted, timeout, recovery,
#   rate-limited, busy, network-full, unavailable, route-unavailable
#
# TYPES:
#   message, actionbar, title, sound, command, disconnect, connect,
#   teleport, gamemode, bossbar
#
# Общие поля:
#   enabled, type, delay-ms, chance-percent, permission, stop-after
#
# BossBar operations:
#   show, update, animate, set-progress, add-progress,
#   pause, resume, hide, remove
# =============================================================================
actions:
  enabled: true

  triggers:
    challenge-start:
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "animate"
        text: "<gradient:#54F4D1:#4D9CFF><bold>pnCaptcha</bold></gradient> <dark_gray>• <white>{bossbar_seconds}s</white> <dark_gray>• <gray>{remaining} попыток</gray>"
        bossbar-color: "blue"
        bossbar-overlay: "progress"
        bossbar-start-progress: 1.0
        bossbar-end-progress: 0.0
        bossbar-duration-ms: 0
        bossbar-update-interval-ms: 100
        bossbar-hide-on-finish: false
        bossbar-remove-on-finish: true

      - type: "title"
        title: "<gradient:#54F4D1:#4D9CFF><bold>pnCaptcha</bold></gradient>"
        subtitle: "<gray>Введи код из блоков в чат</gray>"
        fade-in-ms: 250
        stay-ms: 1400
        fade-out-ms: 350

      - type: "sound"
        sound: "minecraft:block.amethyst_block.chime"
        source: "master"
        volume: 0.7
        sound-pitch: 1.15

    wrong-answer:
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "add-progress"
        bossbar-progress-delta: -0.12
        bossbar-color: "red"
        text: "<red><bold>Неверно</bold></red> <dark_gray>• <white>{remaining}</white> <gray>попыток осталось</gray> <dark_gray>• <white>{bossbar_seconds}s</white>"

      - type: "actionbar"
        text: "<red>Неверный код</red> <dark_gray>• <gray>{attempt}/{max}</gray> <dark_gray>• <white>{remaining}</white> осталось"

      - type: "sound"
        sound: "minecraft:block.note_block.bass"
        source: "master"
        volume: 0.8
        sound-pitch: 0.7

    passed:
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "remove"

      - type: "title"
        title: "<green><bold>Проверка пройдена</bold></green>"
        subtitle: "<gray>Подключение к <white>{server}</white></gray>"
        fade-in-ms: 150
        stay-ms: 900
        fade-out-ms: 250

      - type: "sound"
        sound: "minecraft:entity.player.levelup"
        source: "master"
        volume: 0.7
        sound-pitch: 1.2

    recovery:
      - type: "actionbar"
        text: "<yellow>Возврат на платформу</yellow> <dark_gray>• <gray>{reason}</gray>"

    exhausted:
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "remove"
      - type: "sound"
        sound: "minecraft:entity.villager.no"
        source: "master"
        volume: 0.8
        sound-pitch: 0.8

    timeout:
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "remove"
      - type: "sound"
        sound: "minecraft:block.beacon.deactivate"
        source: "master"
        volume: 0.8
        sound-pitch: 0.8

    rate-limited: []
    busy: []
    network-full: []
    unavailable: []
    route-unavailable: []

  # ---------------------------------------------------------------------------
  # КОПИРУЕМЫЕ ПРИМЕРЫ
  # ---------------------------------------------------------------------------
  # MESSAGE:
  # - type: "message"
  #   lines:
  #     - "<aqua>Привет, {player}</aqua>"
  #     - "<gray>Онлайн сети: {online}</gray>"
  #
  # ACTIONBAR:
  # - type: "actionbar"
  #   text: "<yellow>Осталось попыток: {remaining}</yellow>"
  #
  # TITLE:
  # - type: "title"
  #   title: "<green><bold>Готово</bold></green>"
  #   subtitle: "<gray>Подключаем…</gray>"
  #
  # SOUND:
  # - type: "sound"
  #   sound: "minecraft:entity.experience_orb.pickup"
  #   volume: 0.8
  #   sound-pitch: 1.2
  #
  # COMMAND:
  # - type: "command"
  #   command: "alert {player} прошёл pnCaptcha"
  #
  # DISCONNECT:
  # - type: "disconnect"
  #   text: "<red>Проверка остановлена</red>"
  #
  # CONNECT через router:
  # - type: "connect"
  #   server: "@route"
  #
  # TELEPORT:
  # - type: "teleport"
  #   x: 0.5
  #   y: 70.0
  #   z: 0.5
  #   yaw: 0.0
  #   pitch: 0.0
  #
  # GAMEMODE:
  # - type: "gamemode"
  #   game-mode: "adventure"
  #
  # BOSSBAR COUNTUP:
  # - type: "bossbar"
  #   bossbar-id: "loading"
  #   bossbar-operation: "animate"
  #   text: "<aqua>Загрузка <white>{bossbar_percent}%</white></aqua>"
  #   bossbar-start-progress: 0.0
  #   bossbar-end-progress: 1.0
  #   bossbar-duration-ms: 3000
  #   bossbar-remove-on-finish: true
  #
  # BOSSBAR PAUSE/RESUME:
  # - type: "bossbar"
  #   bossbar-id: "captcha-timer"
  #   bossbar-operation: "pause"
