# =============================================================================
# pnCaptcha — ПОЛНАЯ КОНФИГУРАЦИЯ И ВСТРОЕННАЯ ДОКУМЕНТАЦИЯ
# =============================================================================
# Этот файл специально сделан так, чтобы администратору не приходилось искать
# значения по исходникам, Discord или чужим конфигам.
#
# ПРАВИЛО ДЛЯ КАЖДОГО ПАРАМЕТРА В ЭТОМ ФАЙЛЕ:
# - что он делает;
# - какие значения принимает;
# - что означает специальное значение вроде 0;
# - пример того, когда настройка полезна.
#
# После изменения config.yml полностью перезапусти Velocity.
# Горячей перезагрузки конфигурации сейчас нет.
#
# Дополнительные готовые пресеты и сценарии находятся в каталоге GitHub:
#   examples/
# Там есть визуальные стили, routing и Action/BossBar-примеры.
#
# Minecraft-материалы и звуки указываются с namespace:
#   minecraft:polished_deepslate
#   minecraft:cyan_stained_glass
#   minecraft:entity.player.levelup
#
# MiniMessage доступен в messages.* и текстовых Actions. Например:
#   <red>Ошибка</red>
#   <#55ddff>HEX</#55ddff>
#   <gradient:#55ddff:#8b5cf6><bold>pnCaptcha</bold></gradient>
#   <hover:show_text:'<gray>Подсказка'>Текст</hover>
#   <click:open_url:'https://example.com'>Ссылка</click>
#
# ОСНОВНЫЕ PLACEHOLDERS ACTIONS:
#   {player}    — ник игрока
#   {uuid}      — UUID игрока
#   {ip}        — IP игрока
#   {online}    — текущий онлайн Velocity
#   {attempt}   — количество уже использованных неверных попыток
#   {max}       — максимальное количество попыток
#   {remaining} — сколько попыток осталось
#   {timeout}   — общий timeout CAPTCHA в секундах
#   {reason}    — причина события, например recovery
#   {server}    — выбранный backend
#   {captcha}   — текущий правильный ответ; НЕ показывай обычным игрокам
#
# ДОПОЛНИТЕЛЬНЫЕ PLACEHOLDERS BOSSBAR:
#   {bossbar_progress} — текущий progress 0.000..1.000
#   {bossbar_percent}  — текущий progress 0..100
#   {bossbar_seconds}  — сколько секунд осталось у текущей анимации
#   {bossbar_millis}   — сколько миллисекунд осталось у текущей анимации
#
# БЫСТРЫЙ ВОЗВРАТ К ПРЕЖНЕМУ ПЛОТНОМУ ВИЗУАЛУ:
#   font.preset: "classic-5x7"
#   scene.distance-blocks: 30.0
#   scene.rotation.yaw-degrees: 28.0
#   geometry.pixel-width: 2
#   geometry.pixel-height: 2
#   geometry.depth-blocks: 3
#   geometry.fill.mode: "solid"
#   palette.mode: "per-block"
#   palette.outline.enabled: false
#
# config-version относится к СХЕМЕ конфига, а не к версии плагина.
# Не меняй это число вручную.
# =============================================================================
config-version: 3

# =============================================================================
# ОБЩАЯ ЛОГИКА CAPTCHA
# =============================================================================
general:
  # Длина случайного кода.
  # Допустимо: 3..12.
  # Чем больше число, тем сложнее проверка, но тем дольше обычный игрок вводит код.
  # Пример: 5 может создать "K7M2P".
  captcha-length: 5

  # Сколько неправильных ответов разрешено до trigger exhausted.
  # Допустимо: 1..20.
  # Пример: 3 = после третьего неправильного ответа игрок исчерпает попытки.
  max-attempts: 3

  # Максимальное время всей CAPTCHA-сессии в секундах.
  # Допустимо: 5..600.
  # Это значение также можно автоматически использовать как длительность BossBar.
  # Пример: 30 = игроку даётся 30 секунд.
  timeout-seconds: 30

  # Сколько минут помнить успешно проверенную пару UUID+IP.
  # Допустимо: 1..43200.
  # Пока запись действует, повторное подключение того же UUID с того же IP
  # не проходит CAPTCHA ещё раз.
  # Пример: 720 = 12 часов.
  verified-cache-minutes: 720

  input:
    # Учитывать регистр ответа.
    # true  -> "aBc12" и "ABC12" считаются разными.
    # false -> регистр игнорируется.
    # Для обычной CAPTCHA рекомендуется false.
    case-sensitive: false

    # Убирать пробелы в начале и конце введённого сообщения.
    # true: "  ABC12  " -> "ABC12".
    trim: true

    # Убирать пробелы и другие whitespace-символы внутри ответа.
    # true: "A B C 1 2" -> "ABC12".
    # Полезно, если игрок случайно вводит код с пробелами.
    remove-spaces: true

    # Максимальная длина сообщения, которое pnCaptcha вообще рассматривает
    # как возможный ответ.
    # Допустимо: 3..256.
    # Длинные сообщения выше лимита не сравниваются с CAPTCHA.
    max-length: 32

# =============================================================================
# МАРШРУТИЗАЦИЯ ПОСЛЕ УСПЕШНОЙ ПРОВЕРКИ
# =============================================================================
routing:
  # Стратегия выбора backend-сервера.
  # Доступно:
  #   priority        — сервер с наименьшим priority.
  #   least-players   — сервер с наименьшим числом игроков через Velocity.
  #   random          — случайный доступный сервер.
  #   weighted-random — случайный сервер с учётом weight.
  #   round-robin     — серверы выбираются по очереди.
  #   first-available — первый доступный сервер по порядку списка.
  #
  # Для нескольких lobby обычно удобно least-players.
  # Для основного+резервного lobby удобно priority.
  strategy: "least-players"

  # Общий лимит игроков всей Velocity-сети, применяемый перед CAPTCHA.
  # 0 = pnCaptcha не применяет глобальный лимит.
  # Пример: 500 вместе с reserve=10 оставит 10 мест зарезервированными.
  network-max-players: 0

  # Количество зарезервированных мест внутри network-max-players.
  # 0 = резерв отсутствует.
  # Пример: max=500, reserve=10 -> обычный вход останавливается на 490.
  network-reserve-slots: 0

  # Permission для использования глобального резерва.
  # Игрок с этим permission может войти в зарезервированные слоты.
  # Пустая строка отключает эту возможность.
  full-bypass-permission: "pncaptcha.full.bypass"

  # Что делать, если ни один явно перечисленный сервер не подходит.
  # false -> использовать ТОЛЬКО routing.servers.
  # true  -> разрешить fallback на любой RegisteredServer из velocity.toml.
  # Включай true только если действительно доверяешь всем зарегистрированным backend.
  fallback-to-any-registered: false

  # Список backend-серверов.
  # Их может быть сколько угодно.
  # name ОБЯЗАН точно совпадать с именем сервера в velocity.toml.
  servers:
    - name: "lobby"

      # Участвует ли сервер в обычном выборе.
      # false удобно для временного обслуживания без удаления настройки.
      enabled: true

      # Приоритет для strategy: priority.
      # Чем МЕНЬШЕ число, тем выше приоритет.
      # Пример: 10 будет выбран раньше 100.
      priority: 10

      # Вес для strategy: weighted-random.
      # Допустимо положительное число.
      # Пример: weight=10 примерно в 10 раз вероятнее weight=1.
      weight: 5

      # Лимит игроков конкретного backend по данным Velocity.
      # 0 = pnCaptcha не ограничивает этот сервер.
      max-players: 0

      # Сколько мест backend оставить свободными от обычного routing.
      # Пример: max=150, reserve=5 -> сервер исключается при 145 игроках.
      reserve-slots: 0

    # ПРИМЕР ВТОРОГО LOBBY:
    # - name: "lobby-2"
    #   enabled: true
    #   priority: 10
    #   weight: 5
    #   max-players: 150
    #   reserve-slots: 5

    # ПРИМЕР РЕЗЕРВНОГО BACKEND:
    # - name: "fallback"
    #   enabled: true
    #   priority: 100
    #   weight: 1
    #   max-players: 50
    #   reserve-slots: 2

# =============================================================================
# ЗАЩИТА ОТ СПАМА ПОДКЛЮЧЕНИЙ
# =============================================================================
security:
  # Максимальное количество новых входов с одного IP за окно ниже.
  # Допустимо: 1..10000.
  # Пример: 6 входов за 10 секунд.
  max-joins-per-window: 6

  # Размер окна IP rate-limit в секундах.
  # Допустимо: 1..3600.
  join-window-seconds: 10

  # Максимальное количество одновременно существующих персональных
  # CAPTCHA VirtualWorld.
  # Допустимо: 1..10000.
  # Это предохранитель памяти при большом потоке подключений.
  max-active-captchas: 128

  # Permission полного обхода CAPTCHA.
  # Игрок с permission не создаёт Limbo-сессию и проходит дальше.
  # Пустая строка отключает bypass.
  bypass-permission: "pncaptcha.bypass"

# =============================================================================
# BSTATS
# =============================================================================
metrics:
  # Локально включить bStats для pnCaptcha.
  # Глобальный plugins/bStats/config.txt владельца сервера имеет приоритет.
  # Если глобальный bStats выключен, true здесь не заставит его отправлять данные.
  enabled: true

  # Отправлять агрегированные custom charts pnCaptcha.
  # В charts могут попадать режим routing, количество route-серверов,
  # длина CAPTCHA, тип шрифта, глубина, включённые Actions и т.п.
  # IP, UUID, правильные ответы CAPTCHA и сообщения игроков не отправляются.
  custom-charts: true

# =============================================================================
# ПРОВЕРКА ОБНОВЛЕНИЙ
# =============================================================================
updates:
  # Главный переключатель встроенного GitHub update checker.
  # false полностью отключает сетевые запросы проверки версии.
  enabled: true

  # Проверять новый GitHub Release после запуска Velocity.
  check-on-startup: true

  # Задержка первой проверки после запуска в секундах.
  # Допустимо: 0..120.
  # Небольшая задержка позволяет не мешать основному startup.
  startup-delay-seconds: 2

  # Репозиторий GitHub в формате owner/repository.
  # Обычно менять не нужно.
  repository: "pnFolder/pnCaptcha"

  # HTTP timeout запроса к GitHub в секундах.
  # Допустимо: 1..30.
  request-timeout-seconds: 5

  # Печатать информацию о найденном обновлении в консоль Velocity.
  notify-console: true

  # Показывать уведомление о новой версии вошедшим администраторам.
  notify-players: true

  # Permission, необходимый игроку для получения update-уведомления.
  notify-permission: "pncaptcha.admin"

  # true = update checker также может сообщать, что установлена последняя версия.
  # false = молчать, если обновлений нет.
  announce-up-to-date: true

# =============================================================================
# LIMBO WORLD
# =============================================================================
limbo:
  # Базовая view distance персонального Limbo в чанках.
  # Допустимо: 2..32.
  # Далёкий/крупный объект может автоматически увеличить фактическое значение,
  # если auto-expand-view-distance включён.
  view-distance: 10

  # Simulation distance внутри Limbo.
  # Допустимо: 2..32.
  # Фактически она не должна быть выше используемой view distance.
  simulation-distance: 8

  # Автоматически рассчитать требуемую view distance по реальным границам CAPTCHA.
  # Для mosaic/далёкой сцены рекомендуется true.
  auto-expand-view-distance: true

  # Верхний предел автоматического расширения view distance.
  # Допустимо: 2..32.
  # Увеличивай, только если очень большая CAPTCHA реально не помещается.
  max-auto-view-distance: 16

  # Сколько дополнительных чанков заранее создать вокруг вычисленных границ.
  # Допустимо: 0..8.
  # 1 обычно достаточно. 2 может помочь при экстремальных углах и noise.
  precreate-padding-chunks: 1

  # true уменьшает часть debug-информации Minecraft-клиента в Limbo.
  reduced-debug-info: false

  # Время виртуального мира Minecraft, 0..24000.
  # 0 = рассвет, 6000 = день, 12000 = закат, 18000 = ночь.
  world-time-ticks: 6000

  # Разрешить обычное падение/гравитацию игрока.
  # Если recovery.enabled=true, реальное движение необходимо для обнаружения падения.
  falling-enabled: true

  light:
    # Уровень sky light 0..15.
    # 15 = максимально светло.
    sky: 15

    # Уровень block light 0..15.
    block: 15

  pedestal:
    # Создавать физическую платформу под spawn игрока.
    enabled: true

    # Материал платформы.
    # Пример: minecraft:deepslate_tiles.
    block: "minecraft:deepslate_tiles"

    # Размер платформы по X, допустимо 1..16.
    # 1 = один блок шириной.
    size-x: 1

    # Размер платформы по Z, допустимо 1..16.
    size-z: 1

    # Смещение платформы по Y относительно player.spawn.y.
    # -1 = прямо под ногами.
    y-offset: -1

# =============================================================================
# ИГРОК, SPAWN, КАМЕРА И RECOVERY
# =============================================================================
player:
  # Режим игрока внутри Limbo.
  # Доступно: creative | adventure | survival | spectator.
  # creative удобен для визуального тестирования, adventure — для более строгого Limbo.
  game-mode: "creative"

  # Ограничивать ли игрока около точки spawn.
  # true -> при уходе дальше lock-radius-blocks логика сессии может вернуть игрока.
  lock-position: false

  # Разрешённый радиус перемещения при lock-position=true.
  # Допустимо: 0.1..128.0.
  lock-radius-blocks: 1.5

  spawn:
    # Координата X точки появления в персональном VirtualWorld.
    x: 0.5

    # Координата Y точки появления.
    y: 65.0

    # Координата Z точки появления.
    z: 0.5

  camera:
    # Автоматически рассчитать yaw/pitch так, чтобы игрок смотрел в центр CAPTCHA.
    # true рекомендуется почти всегда.
    # false использует yaw-degrees/pitch-degrees вручную.
    auto-aim: true

    # Ручной yaw, используемый при auto-aim=false.
    yaw-degrees: 0.0

    # Ручной pitch, используемый при auto-aim=false.
    pitch-degrees: 0.0

    # Дополнительная поправка yaw поверх автоматического или ручного направления.
    # Пример: 5.0 слегка повернёт камеру вправо/влево относительно рассчитанного центра.
    yaw-offset-degrees: 0.0

    # Дополнительная поправка pitch.
    # Положительное/отрицательное значение позволяет тонко поднять/опустить взгляд.
    pitch-offset-degrees: 0.0

  recovery:
    # Автоматически возвращать игрока к безопасной точке, если он упал,
    # улетел слишком высоко или ушёл слишком далеко.
    enabled: true

    # На сколько блоков ниже spawn разрешено опуститься.
    # Допустимо: 0..256.
    # 0 отключает именно эту проверку.
    below-spawn-blocks: 8.0

    # На сколько блоков выше spawn разрешено подняться.
    # Допустимо: 0..256.
    # 0 отключает именно эту проверку.
    above-spawn-blocks: 40.0

    # Максимальная горизонтальная дистанция от spawn.
    # Допустимо: 0..512.
    # 0 отключает именно эту проверку.
    max-horizontal-distance-blocks: 48.0

    # Минимальный интервал между recovery-телепортами в миллисекундах.
    # Допустимо: 0..60000.
    # Защищает от постоянного teleport spam.
    cooldown-millis: 500

    # true = после recovery оставить текущий yaw/pitch игрока.
    # false = снова направить игрока на CAPTCHA.
    preserve-current-look: false

    # Показывать стандартное messages.recovered при recovery.
    # Action trigger recovery работает независимо от этого параметра.
    send-message: true

# =============================================================================
# ПОЛОЖЕНИЕ И УГОЛ ВСЕЙ 3D CAPTCHA
# =============================================================================
scene:
  # Расстояние центра CAPTCHA от игрока в блоках.
  # Допустимо: 4..256.
  # Новый mosaic-стиль рассчитан примерно на 36..48 блоков.
  # 42 делает символы крупными, но позволяет целиком видеть строку.
  distance-blocks: 42.0

  # Направление, куда вынесен объект относительно игрока.
  # Допустимо: -180..180.
  #   0   = +Z
  #   90  = -X
  #  -90  = +X
  #   180 = -Z
  forward-yaw-degrees: 0.0

  # Боковое смещение всей CAPTCHA относительно направления forward-yaw.
  # 0 = центр по оси взгляда.
  # Положительное/отрицательное значение позволяет увести сцену в сторону.
  lateral-offset-blocks: 0.0

  # Высота центра CAPTCHA относительно позиции игрока.
  # Допустимо: -64..128.
  # 7 означает центр примерно на 7 блоков выше точки spawn.
  center-height-blocks: 7.0

  rotation:
    # Общий yaw самой 3D-конструкции.
    # Допустимо: -180..180.
    # 0 = фронтально; 8 = лёгкий 3D-ракурс; 28 = заметный боковой ракурс старого стиля.
    yaw-degrees: 8.0

    # Наклон верхней части объекта вперёд/назад.
    # Допустимо: -89..89.
    pitch-degrees: 0.0

    # Диагональный наклон всей строки.
    # Допустимо: -89..89.
    roll-degrees: 0.0

# =============================================================================
# ШРИФТ
# =============================================================================
font:
  # Встроенный/пользовательский шрифт CAPTCHA.
  # Доступно:
  #   ornate-9x12 — крупный декоративный 9x12, рассчитан на mosaic/porous стиль;
  #   classic-5x7 — компактный старый читаемый bitmap-шрифт;
  #   custom      — полностью пользовательские glyph из custom-glyphs.
  preset: "ornate-9x12"

  # Набор символов, из которых генератор имеет право создавать код.
  # Каждый символ ОБЯЗАН существовать в выбранном font preset.
  # По умолчанию исключены похожие 0/O и 1/I/L.
  alphabet: "ABCDEFGHJKMNPQRSTUVWXYZ23456789"

  # Используется только при preset: custom.
  # Все glyph должны иметь ОДИНАКОВУЮ ширину и высоту.
  # 1 = voxel существует, 0 = пустое место.
  custom-glyphs: {}

  # ПРИМЕР custom font 5x7:
  # custom-glyphs:
  #   A:
  #     - "01110"
  #     - "10001"
  #     - "10001"
  #     - "11111"
  #     - "10001"
  #     - "10001"
  #     - "10001"
  #   B:
  #     - "11110"
  #     - "10001"
  #     - "10001"
  #     - "11110"
  #     - "10001"
  #     - "10001"
  #     - "11110"

# =============================================================================
# ГЕОМЕТРИЯ VOXEL-СИМВОЛОВ
# =============================================================================
geometry:
  # Ширина одного bitmap-пикселя в Minecraft-блоках.
  # Допустимо: 1..8.
  # ornate-9x12 обычно лучше выглядит с 1.
  # classic-5x7 можно сделать массивнее значением 2.
  pixel-width: 1

  # Высота одного bitmap-пикселя в Minecraft-блоках.
  # Допустимо: 1..8.
  pixel-height: 1

  # Полная 3D-глубина каждого активного bitmap-пикселя.
  # Допустимо: 1..24.
  # 1 = почти плоско; 3..5 = выраженный объём; большие значения дают очень толстые буквы.
  depth-blocks: 4

  # Сколько передних depth-слоёв используют palette.front.
  # Минимум 1, максимум depth-blocks.
  front-thickness-blocks: 1

  # Сколько задних depth-слоёв используют palette.back.
  # Остаток между front/back использует palette.side.
  # front + back не может быть больше depth-blocks.
  back-thickness-blocks: 1

  # Расстояние между соседними символами в блоках.
  # Допустимо: 0..24.
  letter-gap-blocks: 2

  # Насколько каждая следующая буква поднимается/опускается относительно предыдущей.
  # Допустимо: -16..16.
  # Пример: 0.5 создаёт ступеньку вверх; -0.5 — вниз.
  letter-rise-blocks: 0.0

  # Насколько каждая следующая буква уходит вперёд/назад по глубине.
  # Допустимо: -16..16.
  # Полезно для перспективной композиции.
  letter-depth-step-blocks: 0.0

  # true = центрировать всю строку относительно scene center.
  # false = первая буква начинается от локального начала сцены.
  center-text: true

  # Зеркально отразить bitmap слева направо.
  mirror-horizontal: false

  # Зеркально отразить bitmap сверху вниз.
  mirror-vertical: false

  # Направление 3D extrusion.
  # false = глубина уходит от игрока.
  # true  = глубина вытягивается в сторону игрока.
  extrude-toward-camera: false

  # ---------------------------------------------------------------------------
  # FILL — ПЛОТНЫЕ ИЛИ КОНТРОЛИРУЕМО «ДЫРЧАТЫЕ» СИМВОЛЫ
  # ---------------------------------------------------------------------------
  fill:
    # Режим заполнения поверхности glyph.
    # solid  -> ничего не удаляется, классическая плотная буква.
    # porous -> часть подходящих voxel удаляется и создаёт мозаичные пустоты.
    mode: "porous"

    # Какую долю активных элементов glyph приблизительно оставить.
    # Допустимо: 0.35..1.0.
    # 1.0 = практически плотная форма.
    # 0.78 = мягкая пористость по умолчанию.
    # 0.55 = заметно более рваная форма.
    # Алгоритм может сохранить больше, если удаление разрушило бы читаемость/связность.
    density: 0.78

    # Проверять после удаления, что glyph не распался на несвязанные островки.
    # true настоятельно рекомендуется для production.
    preserve-connectivity: true

    # Беречь концевые точки штрихов от удаления.
    # true помогает не потерять окончания у 7, T, F, P и похожих символов.
    protect-endpoints: true

    # Насколько сильно сохранять внешнюю границу glyph.
    # Допустимо: 0..100 процентов.
    # 0   = контур не имеет дополнительной защиты.
    # 78  = текущий сбалансированный mosaic.
    # 100 = внешний контур максимально защищён, пустоты уходят в первую очередь внутрь.
    outline-preserve-percent: 78.0

    # Минимум активных surface-пикселей, которые должны остаться в символе.
    # Допустимо: 1..2048.
    # Это дополнительная страховка для небольших custom glyph.
    min-retained-pixels: 14

# =============================================================================
# РАНДОМНОСТЬ СИМВОЛОВ И ВСЕЙ СЦЕНЫ
# =============================================================================
randomness:
  # Главный переключатель всех jitter-настроек ниже.
  # false = все случайные отклонения отключаются.
  enabled: true

  # Как получать seed.
  # random -> каждый вход получает новую случайную композицию.
  # fixed  -> используется fixed-seed; полезно для настройки и повторяемых скриншотов.
  seed-mode: "random"

  # Используется только при seed-mode=fixed.
  # Одинаковый seed + одинаковый код/конфиг дают воспроизводимую случайность.
  fixed-seed: 1337

  character:
    # Максимальный случайный сдвиг каждой буквы влево/вправо.
    # Допустимо: 0..12 блоков.
    horizontal-jitter-blocks: 0

    # Максимальный случайный сдвиг каждой буквы вверх/вниз.
    # Допустимо: 0..12.
    vertical-jitter-blocks: 0

    # Максимальный случайный сдвиг отдельной буквы по глубине.
    # Допустимо: 0..12.
    depth-jitter-blocks: 0

    # Случайно добавлять до N блоков к depth-blocks отдельной буквы.
    # Допустимо: 0..12.
    depth-variation-blocks: 0

    # Максимальное индивидуальное случайное отклонение yaw каждого символа.
    # Допустимо: 0..45 градусов.
    # 1.5 даёт едва заметную живость без разрушения строки.
    rotation-yaw-jitter-degrees: 1.5

    # Максимальное индивидуальное отклонение pitch, 0..45.
    rotation-pitch-jitter-degrees: 0.75

    # Максимальное индивидуальное отклонение roll, 0..45.
    rotation-roll-jitter-degrees: 0.5

  scene:
    # Случайно менять общую дистанцию сцены на ±N блоков.
    # Допустимо: 0..64.
    distance-jitter-blocks: 0.0

    # Случайно менять общую высоту на ±N блоков.
    # Допустимо: 0..64.
    height-jitter-blocks: 0.0

    # Случайно сдвигать всю сцену влево/вправо на ±N блоков.
    # Допустимо: 0..64.
    lateral-jitter-blocks: 0.0

    # Случайно менять направление расположения всей сцены вокруг игрока.
    # Допустимо: 0..90 градусов.
    forward-yaw-jitter-degrees: 0.0

    # Случайное отклонение общего yaw всей 3D-конструкции.
    # Допустимо: 0..90.
    rotation-yaw-jitter-degrees: 1.0

    # Случайное отклонение общего pitch, 0..45.
    rotation-pitch-jitter-degrees: 0.0

    # Случайное отклонение общего roll, 0..45.
    rotation-roll-jitter-degrees: 0.0

# =============================================================================
# ПАЛИТРЫ И МАТЕРИАЛЫ 3D CAPTCHA
# =============================================================================
palette:
  # Режим выбора материалов.
  # Доступно:
  #   per-block     — каждый voxel выбирает материал независимо;
  #   per-character — один выбранный материал стабильнее внутри буквы;
  #   solid         — всегда используется первый материал группы;
  #   clustered     — соседние voxel используют общий материал цветными пятнами.
  #
  # clustered лучше всего имитирует референс с перемешанными «ингредиентами».
  mode: "clustered"

  # Минимальный размер цветового пятна для clustered.
  # Допустимо: 1..32.
  cluster-size-min: 2

  # Максимальный размер цветового пятна для clustered.
  # Допустимо: cluster-size-min..64.
  # Диапазон 2..5 даёт небольшие группы, а не гигантские одноцветные области.
  cluster-size-max: 5

  # Передняя поверхность символов.
  # weight — относительный вес материала, а НЕ процент.
  # Например веса 4 и 2 означают, что первый материал выбирается примерно вдвое чаще.
  # Stained glass даёт настоящую ванильную прозрачность; произвольного numeric alpha
  # у обычных Minecraft-блоков нет.
  front:
    - block: "minecraft:cyan_stained_glass"
      weight: 4
    - block: "minecraft:light_blue_stained_glass"
      weight: 4
    - block: "minecraft:blue_stained_glass"
      weight: 3
    - block: "minecraft:gray_stained_glass"
      weight: 3
    - block: "minecraft:cyan_terracotta"
      weight: 3
    - block: "minecraft:light_blue_terracotta"
      weight: 2
    - block: "minecraft:weathered_cut_copper"
      weight: 2
    - block: "minecraft:oxidized_cut_copper"
      weight: 2
    - block: "minecraft:polished_deepslate"
      weight: 3

  # Боковые грани 3D extrusion.
  # Они намеренно темнее front, чтобы глубина читалась даже издалека.
  side:
    - block: "minecraft:deepslate_tiles"
      weight: 5
    - block: "minecraft:polished_deepslate"
      weight: 4
    - block: "minecraft:blackstone"
      weight: 3
    - block: "minecraft:gray_stained_glass"
      weight: 2
    - block: "minecraft:oxidized_cut_copper"
      weight: 1

  # Задняя поверхность символов.
  back:
    - block: "minecraft:blackstone"
      weight: 5
    - block: "minecraft:polished_blackstone"
      weight: 3
    - block: "minecraft:deepslate_tiles"
      weight: 2

  accent:
    # Добавлять редкие accent-материалы поверх обычного выбора front.
    enabled: true

    # Вероятность accent на подходящем front voxel, 0..100.
    # 5 = редкие медные точки; 25 = акцент будет очень заметным.
    chance-percent: 5.0

    # Палитра accent-блоков.
    materials:
      - block: "minecraft:cut_copper"
        weight: 2
      - block: "minecraft:weathered_cut_copper"
        weight: 2
      - block: "minecraft:oxidized_cut_copper"
        weight: 1

  outline:
    # Отдельно окрашивать внешнюю границу исходного glyph.
    # Это не добавляет новые блоки — только меняет материал подходящих front-voxel.
    # Особенно полезно вместе с fill.mode=porous.
    enabled: true

    # Вероятность применить outline-палитру к граничному voxel, 0..100.
    # 86 = большая часть внешнего силуэта становится тёмной, но не абсолютно вся.
    chance-percent: 86.0

    # Палитра внешнего контура.
    materials:
      - block: "minecraft:polished_deepslate"
        weight: 5
      - block: "minecraft:deepslate_tiles"
        weight: 4
      - block: "minecraft:blackstone"
        weight: 3
      - block: "minecraft:gray_stained_glass"
        weight: 2

# =============================================================================
# ВИЗУАЛЬНЫЕ ПОМЕХИ ВОКРУГ CAPTCHA
# =============================================================================
noise:
  # Добавлять дополнительные независимые voxel-кластеры около/за строкой.
  # false полностью отключает noise.
  enabled: true

  # Количество центров noise-кластеров.
  # Допустимо: 0..8192.
  # 5 = лёгкий фон; 30+ = уже очень заметные помехи.
  count: 5

  # Минимальный размер одного noise-кластера.
  # Допустимо: 1..32.
  cluster-size-min: 1

  # Максимальный размер noise-кластера.
  # Допустимо: cluster-size-min..64.
  cluster-size-max: 2

  # На сколько блоков noise может выйти левее/правее текста.
  # Допустимо: 0..64.
  horizontal-padding-blocks: 4

  # На сколько блоков noise может выйти выше/ниже текста.
  # Допустимо: 0..64.
  vertical-padding-blocks: 3

  # Минимальная глубина noise относительно основной поверхности.
  # Должно быть >= 0.
  depth-min-blocks: 3

  # Максимальная глубина noise.
  # Должно быть >= depth-min-blocks.
  depth-max-blocks: 7

  # Weighted-материалы noise.
  # Прозрачное stained glass создаёт визуальный шум, но меньше закрывает буквы.
  materials:
    - block: "minecraft:gray_stained_glass"
      weight: 5
    - block: "minecraft:light_blue_stained_glass"
      weight: 3
    - block: "minecraft:cyan_stained_glass"
      weight: 2
    - block: "minecraft:blue_stained_glass"
      weight: 1

# =============================================================================
# ACTIONS — КОНСТРУКТОР РЕАКЦИЙ НА СОБЫТИЯ
# =============================================================================
# Actions позволяют собрать поведение pnCaptcha без изменения Kotlin-кода.
# Внутри одного trigger Actions выполняются по порядку списка.
#
# ДОСТУПНЫЕ TRIGGERS:
#   challenge-start   — игрок полностью появился в CAPTCHA Limbo.
#   wrong-answer      — введён неверный код, но попытки ещё остались.
#   passed            — код введён правильно, backend уже выбран.
#   exhausted         — использованы все попытки.
#   timeout           — истёк general.timeout-seconds.
#   recovery          — игрок возвращён к spawn/pedestal.
#   rate-limited      — IP превысил security rate-limit.
#   busy              — достигнут security.max-active-captchas.
#   network-full      — достигнут routing.network-max-players.
#   unavailable       — Limbo/CAPTCHA не удалось создать.
#   route-unavailable — CAPTCHA пройдена, но router не нашёл backend.
#
# ДОСТУПНЫЕ TYPES:
#   message    — отправить chat-сообщение MiniMessage.
#   actionbar  — показать ActionBar.
#   title      — показать Title и Subtitle.
#   sound      — воспроизвести Minecraft sound.
#   command    — выполнить Velocity-команду от консоли.
#   disconnect — отключить игрока с текстом.
#   connect    — подключить игрока к backend.
#   teleport   — телепортировать игрока внутри текущего Limbo.
#   gamemode   — изменить GameMode внутри Limbo.
#   bossbar    — создать/изменить/анимировать/скрыть/удалить BossBar.
#
# ОБЩИЕ ПОЛЯ ЛЮБОГО ACTION:
#   enabled: true|false
#     Временно включить/выключить конкретный Action без его удаления.
#
#   type: "..."
#     Один из перечисленных выше типов.
#
#   delay-ms: 0
#     Задержка перед выполнением в миллисекундах.
#     Допустимо: 0..300000.
#     Пример: 1500 = выполнить через 1.5 секунды.
#
#   chance-percent: 100.0
#     Вероятность выполнения, 0..100.
#     Пример: 25 = примерно каждый четвёртый раз.
#
#   permission: ""
#     Если строка не пустая, Action выполняется только игроку с этим permission.
#
#   stop-after: false
#     true = после успешного выполнения не продолжать следующие Actions trigger.
#
# TERMINAL ACTIONS:
#   connect и disconnect могут завершать обычный lifecycle текущего события.
#   Если нужно немедленное завершение, не ставь им delay-ms.
#
# -----------------------------------------------------------------------------
# СПРАВКА ПО КАЖДОМУ TYPE
# -----------------------------------------------------------------------------
# message:
#   text  — одна MiniMessage-строка.
#   lines — несколько MiniMessage-строк; удобно для больших сообщений.
#
# actionbar:
#   text — MiniMessage-текст ActionBar.
#
# title:
#   title       — основной заголовок.
#   subtitle    — подзаголовок.
#   fade-in-ms  — время появления.
#   stay-ms     — сколько держать на экране.
#   fade-out-ms — время исчезновения.
#
# sound:
#   sound       — namespaced sound, например minecraft:entity.player.levelup.
#   source      — sound source; обычно master.
#   volume      — допустимо 0..16.
#   sound-pitch — допустимо 0..2.
#
# command:
#   command — команда БЕЗ начального /, выполняется консолью Velocity.
#
# disconnect:
#   text/lines — причина отключения в MiniMessage.
#
# connect:
#   server: "lobby"  — конкретный RegisteredServer.
#   server: "@route" — попросить обычный ServerRouter выбрать backend.
#
# teleport:
#   x/y/z — координаты внутри Limbo.
#   yaw/pitch — необязательное направление камеры.
#
# gamemode:
#   game-mode — adventure | creative | survival | spectator.
#
# -----------------------------------------------------------------------------
# BOSSBAR — ПОЛНАЯ СПРАВКА
# -----------------------------------------------------------------------------
# bossbar-id:
#   Логический ID панели для конкретного игрока.
#   Все Actions с одинаковым ID работают с одной и той же панелью.
#   Пример: captcha-timer, attempts, loading.
#
# bossbar-operation:
#   show         — создать при необходимости, показать и применить параметры.
#   update       — изменить существующую панель.
#   animate      — плавно вести progress от start к end.
#   set-progress — установить абсолютный progress.
#   add-progress — прибавить/вычесть delta у текущего progress.
#   pause        — приостановить текущую анимацию.
#   resume       — продолжить поставленную на паузу анимацию.
#   hide         — скрыть панель, сохранив состояние в памяти.
#   remove       — скрыть, остановить timer и полностью удалить состояние.
#
# text:
#   MiniMessage-заголовок панели. Во время animate может обновляться вместе
#   с {bossbar_seconds}, {bossbar_percent}, {bossbar_progress}.
#
# bossbar-color:
#   blue | green | pink | purple | red | white | yellow
#
# bossbar-overlay:
#   progress | notched_6 | notched_10 | notched_12 | notched_20
#
# bossbar-progress:
#   Абсолютное значение 0.0..1.0 для show/update/set-progress.
#
# bossbar-progress-delta:
#   Изменение -1.0..1.0 для add-progress.
#   Пример: -0.12 отнимает 12% полосы после неправильного ответа.
#
# bossbar-start-progress / bossbar-end-progress:
#   Границы animate.
#   1.0 -> 0.0 = countdown.
#   0.0 -> 1.0 = countup.
#
# bossbar-duration-ms:
#   Длительность animate до 3600000 ms.
#   0 = для CAPTCHA-таймера использовать переданный {timeout}.
#
# bossbar-update-interval-ms:
#   Частота обновления 50..5000 ms.
#   100 ms — хороший баланс плавности и количества обновлений.
#
# bossbar-hide-on-finish:
#   true = после завершения animate скрыть панель, но сохранить состояние.
#
# bossbar-remove-on-finish:
#   true = после завершения animate полностью удалить панель.
#
# -----------------------------------------------------------------------------
# КОПИРУЕМЫЕ ПРИМЕРЫ ACTIONS
# -----------------------------------------------------------------------------
# MESSAGE:
# - type: "message"
#   lines:
#     - "<aqua>Привет, {player}</aqua>"
#     - "<gray>Онлайн: <white>{online}</white></gray>"
#
# ACTIONBAR:
# - type: "actionbar"
#   text: "<yellow>Попыток осталось: {remaining}</yellow>"
#
# TITLE:
# - type: "title"
#   title: "<green><bold>Готово</bold></green>"
#   subtitle: "<gray>Подключаем к серверу…</gray>"
#   fade-in-ms: 150
#   stay-ms: 1000
#   fade-out-ms: 250
#
# SOUND:
# - type: "sound"
#   sound: "minecraft:entity.experience_orb.pickup"
#   source: "master"
#   volume: 0.8
#   sound-pitch: 1.2
#
# COMMAND:
# - type: "command"
#   command: "alert {player} прошёл pnCaptcha"
#
# DISCONNECT:
# - type: "disconnect"
#   lines:
#     - "<red><bold>Проверка остановлена</bold></red>"
#     - "<gray>Подключись снова через несколько секунд.</gray>"
#
# CONNECT К КОНКРЕТНОМУ BACKEND:
# - type: "connect"
#   server: "queue"
#
# CONNECT ЧЕРЕЗ ROUTER:
# - type: "connect"
#   server: "@route"
#
# TELEPORT:
# - type: "teleport"
#   x: 0.5
#   y: 70.0
#   z: 0.5
#   yaw: 0.0
#   pitch: 0.0
#
# GAMEMODE:
# - type: "gamemode"
#   game-mode: "adventure"
#
# PERMISSION + CHANCE:
# - type: "sound"
#   permission: "pncaptcha.vip"
#   chance-percent: 25.0
#   sound: "minecraft:block.note_block.pling"
#
# BOSSBAR COUNTDOWN:
# - type: "bossbar"
#   bossbar-id: "timer"
#   bossbar-operation: "animate"
#   text: "<aqua>Осталось <white>{bossbar_seconds}s</white></aqua>"
#   bossbar-color: "blue"
#   bossbar-start-progress: 1.0
#   bossbar-end-progress: 0.0
#   bossbar-duration-ms: 10000
#
# BOSSBAR COUNTUP:
# - type: "bossbar"
#   bossbar-id: "loading"
#   bossbar-operation: "animate"
#   text: "<aqua>Загрузка <white>{bossbar_percent}%</white></aqua>"
#   bossbar-color: "blue"
#   bossbar-start-progress: 0.0
#   bossbar-end-progress: 1.0
#   bossbar-duration-ms: 3000
#   bossbar-remove-on-finish: true
#
# BOSSBAR ШТРАФ:
# - type: "bossbar"
#   bossbar-id: "captcha-timer"
#   bossbar-operation: "add-progress"
#   bossbar-progress-delta: -0.15
#   bossbar-color: "red"
#
# BOSSBAR PAUSE/RESUME:
# - type: "bossbar"
#   bossbar-id: "captcha-timer"
#   bossbar-operation: "pause"
# - type: "bossbar"
#   delay-ms: 2000
#   bossbar-id: "captcha-timer"
#   bossbar-operation: "resume"
#
# BOSSBAR REMOVE:
# - type: "bossbar"
#   bossbar-id: "captcha-timer"
#   bossbar-operation: "remove"
# =============================================================================
actions:
  # Главный переключатель всей Action-системы.
  # false = никакие configured Actions не запускаются.
  enabled: true

  triggers:
    challenge-start:
      # Основной countdown CAPTCHA.
      # bossbar-duration-ms=0 означает: использовать general.timeout-seconds.
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "animate"
        text: "<gradient:#54F4D1:#4D9CFF><bold>pnCaptcha</bold></gradient> <dark_gray>• <white>{bossbar_seconds}s</white> <dark_gray>• <gray>{remaining} попыток</gray>"
        bossbar-color: "blue"
        bossbar-overlay: "progress"
        bossbar-start-progress: 1.0
        bossbar-end-progress: 0.0
        bossbar-duration-ms: 0
        bossbar-update-interval-ms: 100
        bossbar-hide-on-finish: false
        bossbar-remove-on-finish: true

      # Короткий Title сразу после появления игрока.
      - type: "title"
        title: "<gradient:#54F4D1:#4D9CFF><bold>pnCaptcha</bold></gradient>"
        subtitle: "<gray>Введи код из блоков в чат</gray>"
        fade-in-ms: 250
        stay-ms: 1400
        fade-out-ms: 350

      # Звук начала проверки.
      - type: "sound"
        sound: "minecraft:block.amethyst_block.chime"
        source: "master"
        volume: 0.7
        sound-pitch: 1.15

    wrong-answer:
      # Ошибка дополнительно отнимает 12% у работающего BossBar.
      # Та же панель находится по bossbar-id.
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "add-progress"
        bossbar-progress-delta: -0.12
        bossbar-color: "red"
        text: "<red><bold>Неверно</bold></red> <dark_gray>• <white>{remaining}</white> <gray>попыток осталось</gray> <dark_gray>• <white>{bossbar_seconds}s</white>"

      # Дополнительная короткая подсказка над hotbar.
      - type: "actionbar"
        text: "<red>Неверный код</red> <dark_gray>• <gray>{attempt}/{max}</gray> <dark_gray>• <white>{remaining}</white> осталось"

      # Низкий звук ошибки.
      - type: "sound"
        sound: "minecraft:block.note_block.bass"
        source: "master"
        volume: 0.8
        sound-pitch: 0.7

    passed:
      # Удалить BossBar перед переходом на backend.
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "remove"

      - type: "title"
        title: "<green><bold>Проверка пройдена</bold></green>"
        subtitle: "<gray>Подключение к <white>{server}</white></gray>"
        fade-in-ms: 150
        stay-ms: 900
        fade-out-ms: 250

      - type: "sound"
        sound: "minecraft:entity.player.levelup"
        source: "master"
        volume: 0.7
        sound-pitch: 1.2

    recovery:
      # Показывается независимо от messages.recovered, если Actions включены.
      - type: "actionbar"
        text: "<yellow>Возврат на платформу</yellow> <dark_gray>• <gray>{reason}</gray>"

    exhausted:
      # Очистить UI перед стандартным завершением сессии.
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "remove"

      - type: "sound"
        sound: "minecraft:entity.villager.no"
        source: "master"
        volume: 0.8
        sound-pitch: 0.8

    timeout:
      # Очистить UI при истечении времени.
      - type: "bossbar"
        bossbar-id: "captcha-timer"
        bossbar-operation: "remove"

      - type: "sound"
        sound: "minecraft:block.beacon.deactivate"
        source: "master"
        volume: 0.8
        sound-pitch: 0.8

    # Эти triggers доступны, но не имеют действий по умолчанию.
    # Добавляй любые Actions из справки выше.
    rate-limited: []
    busy: []
    network-full: []
    unavailable: []
    route-unavailable: []

# =============================================================================
# СТАНДАРТНЫЕ LIFECYCLE-СООБЩЕНИЯ
# =============================================================================
# messages.enabled управляет ТОЛЬКО стандартными сообщениями этого раздела.
# Текстовые Actions не зависят от него и продолжат работать при false.
messages:
  # Главный переключатель стандартных chat-сообщений.
  enabled: true

  # Сообщение после появления игрока в Limbo.
  # Доступно: {max}, {timeout}.
  prompt:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "<gradient:#54F4D1:#4D9CFF><bold>pnCaptcha</bold></gradient> <dark_gray>• <white>Проверка подключения"
    - "<gray>Посмотри на объёмный код и <white>введи его в чат</white>.</gray>"
    - "<gray>Попыток: <aqua>{max}</aqua> <dark_gray>• <gray>Время: <aqua>{timeout}s</aqua>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Неверный ответ, но попытки ещё остались.
  # Доступно: {attempt}, {max}, {remaining}.
  wrong:
    - "<red><bold>Неверный код</bold></red> <dark_gray>• <gray>попытка <white>{attempt}</white>/<white>{max}</white>"
    - "<gray>Проверь символы и отправь ответ ещё раз.</gray>"

  # Проверка пройдена.
  # Доступно: {server}.
  passed:
    - "<green><bold>Проверка пройдена</bold></green>"
    - "<gray>Перенаправляю тебя на <white>{server}</white>…</gray>"

  # Игрок автоматически возвращён в безопасную позицию.
  # Доступно: {reason}.
  recovered:
    - "<yellow><bold>Возврат на платформу</bold></yellow>"
    - "<gray>{reason}</gray>"

  # Истёк general.timeout-seconds.
  timeout:
    - "<red><bold>Время проверки истекло.</bold></red>"

  # Игрок использовал general.max-attempts.
  too-many-attempts:
    - "<red><bold>Слишком много неверных попыток.</bold></red>"

  # Достигнут security.max-active-captchas.
  busy:
    - "<red>Сервис CAPTCHA сейчас перегружен. Попробуй чуть позже.</red>"

  # Сработал security IP rate-limit.
  rate-limited:
    - "<red>Слишком много подключений с твоего IP. Попробуй позже.</red>"

  # Достигнут глобальный routing.network-max-players.
  network-full:
    - "<red>Сеть заполнена. Попробуй подключиться позже.</red>"

  # Не удалось создать персональный Limbo/CAPTCHA.
  unavailable:
    - "<red>CAPTCHA временно недоступна.</red>"

  # Проверка пройдена, но routing не нашёл доступного backend.
  route-unavailable:
    - "<red>Сейчас нет доступного сервера для подключения.</red>"

  # Уведомление администратору о найденном GitHub Release.
  # Доступно: {current}, {latest}, {url}.
  update-available:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "<gradient:#FFD166:#FF6B6B><bold>Доступно обновление pnCaptcha</bold></gradient>"
    - "<gray>Установлено: <white>{current}</white> <dark_gray>→ <gray>новое: <green>{latest}</green>"
    - "<click:open_url:'{url}'><hover:show_text:'<gray>Открыть GitHub Release'><aqua><underlined>Нажми сюда, чтобы открыть релиз</underlined></aqua></hover></click>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
