name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build and test
        run: gradle clean build --stacktrace

      - name: Verify shaded runtime dependencies
        run: |
          JAR="build/libs/pnCaptcha-1.1.1.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'velocity-plugin.json'
          jar tf "$JAR" | grep -q 'config.yml'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/routing/ServerRouter.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/ActionService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/BossBarService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/lib/bstats/velocity/Metrics.class'
          if jar tf "$JAR" | grep -q '^org/bstats/'; then
            echo 'bStats was not relocated correctly'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pnCaptcha
          path: build/libs/pnCaptcha-*.jar
