name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build and test
        run: gradle clean build --stacktrace

      - name: Verify shaded runtime dependencies
        run: |
          VERSION=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -n 1)
          JAR="build/libs/pnCaptcha-${VERSION}-velocity-java21.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'velocity-plugin.json'
          jar tf "$JAR" | grep -q 'config.yml'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/routing/ServerRouter.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/ActionService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/BossBarService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/integration/PnLibraryRuntime.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/lib/pnbootstrap/'

      - uses: actions/upload-artifact@v4
        with:
          name: pnCaptcha
          path: build/libs/pnCaptcha-*.jar
