name: release

on:
  push:
    branches:
      - main

concurrency:
  group: pncaptcha-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.head_commit.message == 'release pnCaptcha 1.1.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build and test
        run: gradle clean build --stacktrace

      - name: Verify release jar
        run: |
          JAR="build/libs/pnCaptcha-1.1.1.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'velocity-plugin.json'
          jar tf "$JAR" | grep -q 'config.yml'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/BossBarService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/lib/bstats/velocity/Metrics.class'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # Корректная bStats-статистика

          pnCaptcha теперь отправляет агрегированную статистику в правильный bStats-проект для Velocity.

          ## Новое
          - Добавлен актуальный bStats service ID `33698` для Velocity-проекта pnCaptcha.

          ## Улучшено
          - Улучшена точность публичной статистики установок и custom charts pnCaptcha.

          ## Исправлено
          - Исправлена отправка метрик в ранее созданный bStats-проект с неправильной платформой.
          - Исправлен bStats service ID в документации и runtime-конфигурации плагина.

          ## Важно
          > Конфигурацию менять не требуется: достаточно заменить JAR и перезапустить Velocity.
          EOF

          gh release create v1.1.1 \
            build/libs/pnCaptcha-1.1.1.jar \
            --target "$GITHUB_SHA" \
            --title 'pnCaptcha — корректная bStats-статистика' \
            --notes-file release-notes.md
