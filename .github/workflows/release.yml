name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Verify release jar
        run: |
          test -f build/libs/pnCaptcha-0.2.2.jar
          jar tf build/libs/pnCaptcha-0.2.2.jar | grep -q 'velocity-plugin.json'
          jar tf build/libs/pnCaptcha-0.2.2.jar | grep -q 'ru/privatenull/pncaptcha/PnCaptchaPlugin.class'
      - name: Publish v0.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2 >/dev/null 2>&1; then
            echo 'Release v0.2.2 already exists; skipping.'
          else
            gh release create v0.2.2 \
              build/libs/pnCaptcha-0.2.2.jar \
              --target "$GITHUB_SHA" \
              --title 'pnCaptcha 0.2.2' \
              --notes 'Perspective 3D CAPTCHA update: corrected mirrored glyph orientation, distant off-axis camera, real 5-block Z extrusion, mottled front and side materials, one pedestal block only, and background-only noise. Requires LimboAPI compatibility mode when PacketEvents is installed.'
          fi
