name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Verify release jar
        run: |
          test -f build/libs/pnCaptcha-0.5.0.jar
          jar tf build/libs/pnCaptcha-0.5.0.jar | grep -q 'velocity-plugin.json'
          jar tf build/libs/pnCaptcha-0.5.0.jar | grep -q 'config.yml'
      - name: Publish
        run: echo 'Use this workflow intentionally for the next public pnCaptcha release.'
