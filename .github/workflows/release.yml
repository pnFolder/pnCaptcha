name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Verify release jar
        run: |
          test -f build/libs/pnCaptcha-0.2.4.jar
          jar tf build/libs/pnCaptcha-0.2.4.jar | grep -q 'velocity-plugin.json'
          jar tf build/libs/pnCaptcha-0.2.4.jar | grep -q 'ru/privatenull/pncaptcha/PnCaptchaPlugin.class'
      - name: Publish v0.2.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.4 >/dev/null 2>&1; then
            echo 'Release v0.2.4 already exists; skipping.'
          else
            gh release create v0.2.4 \
              build/libs/pnCaptcha-0.2.4.jar \
              --target "$GITHUB_SHA" \
              --title 'pnCaptcha 0.2.4' \
              --notes 'True angled-scene update: the whole CAPTCHA plane is physically rotated in X/Z, defaults to 30 blocks away, keeps real 3-block extrusion, supports configurable distance/angle/height/fatness/depth/gap/jitter, automatically aims the camera, pre-creates configured Limbo chunks, and keeps batched post-chunk overlay refreshes.'
          fi
