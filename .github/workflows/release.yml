name: release

on:
  push:
    branches:
      - main

concurrency:
  group: pncaptcha-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.head_commit.message == 'release pnCaptcha 1.1.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build and test
        run: gradle clean build --stacktrace

      - name: Verify release jar
        run: |
          JAR="build/libs/pnCaptcha-1.1.0.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'velocity-plugin.json'
          jar tf "$JAR" | grep -q 'config.yml'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/BossBarService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/lib/bstats/velocity/Metrics.class'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # Интерактивные BossBar Actions и самодокументируемый конфиг

          pnCaptcha теперь позволяет собирать живой интерфейс проверки через BossBar Actions и настраивать каждый параметр прямо по комментариям и примерам в config.yml.

          ## Новое
          - Добавлен Action `bossbar` с отдельными панелями по `bossbar-id` для каждого игрока.
          - Добавлены операции BossBar `show`, `update`, `animate`, `set-progress`, `add-progress`, `pause`, `resume`, `hide` и `remove`.
          - Добавлена плавная анимация BossBar от заданного начального progress к конечному progress.
          - Добавлен автоматический countdown по общему timeout CAPTCHA при `bossbar-duration-ms: 0`.
          - Добавлена поддержка countup-анимации через диапазон progress от `0.0` до `1.0`.
          - Добавлено изменение активной BossBar-анимации во время работы через `add-progress` и `set-progress`.
          - Добавлены настраиваемые цвет и overlay BossBar, включая сегментированные варианты.
          - Добавлены placeholders BossBar `{bossbar_progress}`, `{bossbar_percent}`, `{bossbar_seconds}` и `{bossbar_millis}`.
          - Добавлена возможность автоматически скрывать или полностью удалять BossBar после окончания анимации.
          - Добавлен стандартный CAPTCHA BossBar-таймер, который уменьшается со временем и получает дополнительный штраф после неверного ответа.
          - Добавлены placeholders `{remaining}` и `{timeout}` для остальных Actions.
          - Добавлены копируемые примеры для каждого типа Action прямо в стандартный config.yml.

          ## Улучшено
          - Улучшена документация config.yml: каждый основной параметр теперь сопровождается назначением, допустимыми значениями и практическим примером.
          - Улучшена документация Actions: в конфиге перечислены все triggers, types, общие поля, terminal-поведение и BossBar-операции.
          - Улучшена независимость Actions от стандартных chat-сообщений: отключение `messages.enabled` больше не отключает Title, ActionBar, BossBar и текстовые Actions.
          - Улучшена очистка интерфейса: активные BossBar и их scheduler-задачи удаляются при завершении проверки, отключении игрока и остановке прокси.
          - Улучшена диагностика сборки: CI отдельно проверяет наличие BossBarService в итоговом shaded JAR.

          ## Исправлено
          - Исправлено зависание визуальных элементов после выхода игрока из CAPTCHA-сессии.
          - Исправлена ситуация, когда отключённые стандартные сообщения могли оставлять Actions без отформатированного текста.

          ## Важно
          > Схема конфигурации обновлена: старый config.yml автоматически сохраняется как config.pre-1.1.0.yml.bak, после чего создаётся новый полностью документированный config.yml. Предыдущие GitHub Releases и теги сохраняются.
          EOF

          gh release create v1.1.0 \
            build/libs/pnCaptcha-1.1.0.jar \
            --target "$GITHUB_SHA" \
            --title 'pnCaptcha — BossBar Actions и понятная конфигурация' \
            --notes-file release-notes.md
