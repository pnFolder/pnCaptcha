name: release

on:
  push:
    branches:
      - main

concurrency:
  group: pncaptcha-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ startsWith(github.event.head_commit.message, 'release pnCaptcha 1.2.0') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build and test
        run: gradle clean build --stacktrace

      - name: Verify release jar
        run: |
          JAR="build/libs/pnCaptcha-1.2.0-velocity-java21.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'velocity-plugin.json'
          jar tf "$JAR" | grep -q 'config.yml'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/captcha/CaptchaFont.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/captcha/CaptchaLayout.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/action/BossBarService.class'
          jar tf "$JAR" | grep -q 'ru/privatenull/pncaptcha/lib/bstats/velocity/Metrics.class'
          if jar tf "$JAR" | grep -q '^org/bstats/'; then
            echo 'bStats was not relocated correctly'
            exit 1
          fi

      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 \
            build/libs/pnCaptcha-1.2.0-velocity-java21.jar \
            --target "$GITHUB_SHA" \
            --title 'Мозаичная 3D CAPTCHA' \
            --notes-file docs/releases/v1.2.0.md \
            --latest
