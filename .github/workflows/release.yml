name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Verify release jar
        run: |
          test -f build/libs/pnCaptcha-0.2.5.jar
          jar tf build/libs/pnCaptcha-0.2.5.jar | grep -q 'velocity-plugin.json'
          jar tf build/libs/pnCaptcha-0.2.5.jar | grep -q 'ru/privatenull/pncaptcha/PnCaptchaPlugin.class'
      - name: Publish v0.2.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.5 >/dev/null 2>&1; then
            echo 'Release v0.2.5 already exists; skipping.'
          else
            gh release create v0.2.5 \
              build/libs/pnCaptcha-0.2.5.jar \
              --target "$GITHUB_SHA" \
              --title 'pnCaptcha 0.2.5' \
              --notes 'Angled 3D CAPTCHA scene with automatic config migration: physical X/Z plane rotation, 30-block default distance, configurable angle/height/fatness/depth/gap/jitter, automatic camera aiming, dynamic Limbo chunk preparation, batched fake-block rendering, and post-chunk refreshes.'
          fi
