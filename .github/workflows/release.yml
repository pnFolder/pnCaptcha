name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Verify release jar
        run: |
          test -f build/libs/pnCaptcha-0.2.0.jar
          jar tf build/libs/pnCaptcha-0.2.0.jar | grep -q 'velocity-plugin.json'
          jar tf build/libs/pnCaptcha-0.2.0.jar | grep -q 'ru/privatenull/pncaptcha/PnCaptchaPlugin.class'
      - name: Publish v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'Release v0.2.0 already exists; skipping.'
          else
            gh release create v0.2.0 \
              build/libs/pnCaptcha-0.2.0.jar \
              --target "$GITHUB_SHA" \
              --title 'pnCaptcha 0.2.0' \
              --notes 'First testable packet-rendered CAPTCHA build for Velocity 3.5.x. Requires LimboAPI 1.1.26+ and PacketEvents 2.13.0+. CAPTCHA glyphs are client-only fake block updates inside one shared Limbo world.'
          fi
