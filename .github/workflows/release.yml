name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and test
        run: gradle clean build --stacktrace
      - name: Verify release jar
        run: |
          test -f build/libs/pnCaptcha-0.3.0.jar
          jar tf build/libs/pnCaptcha-0.3.0.jar | grep -q 'velocity-plugin.json'
          jar tf build/libs/pnCaptcha-0.3.0.jar | grep -q 'ru/privatenull/pncaptcha/PnCaptchaPlugin.class'
      - name: Publish v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'Release v0.3.0 already exists; skipping.'
          else
            gh release create v0.3.0 \
              build/libs/pnCaptcha-0.3.0.jar \
              --target "$GITHUB_SHA" \
              --title 'pnCaptcha 0.3.0' \
              --notes 'Rendering architecture rewrite: PacketEvents is no longer required. Every verification session gets a tiny in-memory LimboAPI VirtualWorld containing the real 3D CAPTCHA blocks before spawn, eliminating unloaded-chunk BLOCK_CHANGE races. Includes configurable Limbo view/simulation distance, 30-block angled scene defaults, creative inspection mode, and an active-session memory cap.'
          fi
