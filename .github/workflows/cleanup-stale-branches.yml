name: cleanup-stale-branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'cleanup stale branches')
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/" --paginate --jq '.[].ref' | while read -r ref; do
            branch="${ref#refs/heads/}"
            if [ -n "$branch" ] && [ "$branch" != "main" ]; then
              echo "Deleting branch $branch"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
