plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
    id 'org.jetbrains.kotlin.kapt' version '2.1.10'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'ru.privatenull'
version = '1.2.1'

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { name = 'elytrium'; url = uri('https://maven.elytrium.net/repo/') }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.5.0-SNAPSHOT'
    kapt 'com.velocitypowered:velocity-api:3.5.0-SNAPSHOT'
    compileOnly 'net.elytrium.limboapi:api:1.1.26'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
    implementation 'org.yaml:snakeyaml:2.3'
    implementation 'org.bstats:bstats-velocity:3.2.1'
    implementation('net.kyori:adventure-text-minimessage:4.17.0') {
        exclude group: 'net.kyori', module: 'adventure-api'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.velocitypowered:velocity-api:3.5.0-SNAPSHOT'
    testImplementation 'net.elytrium.limboapi:api:1.1.26'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

kotlin { jvmToolchain(21) }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('jar') { archiveClassifier = 'plain' }

tasks.named('shadowJar') {
    archiveFileName = "pnCaptcha-${project.version}-velocity-java21.jar"
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    relocate 'org.bstats', 'ru.privatenull.pncaptcha.lib.bstats'
}

def verifyBStatsLayout = tasks.register('verifyBStatsLayout') {
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    doLast {
        File archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        Set<String> entries
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            entries = zip.entries()*.name as Set
        }

        [
                'ru/privatenull/pncaptcha/lib/bstats/velocity/Metrics.class',
                'ru/privatenull/pncaptcha/lib/bstats/velocity/Metrics$Factory.class',
                'ru/privatenull/pncaptcha/lib/bstats/MetricsBase.class'
        ].each { required ->
            if (!entries.contains(required)) {
                throw new GradleException("Missing required relocated bStats class: ${required}")
            }
        }
        if (entries.any { it.startsWith('org/bstats/') }) {
            throw new GradleException('Unrelocated org/bstats classes found in the release JAR')
        }
    }
}

tasks.named('build') { dependsOn verifyBStatsLayout }
