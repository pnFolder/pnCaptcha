# Copper Industrial
# Тёмный механический стиль: deepslate/blackstone + разные стадии меди.

scene:
  distance-blocks: 44.0
  center-height-blocks: 6.5
  rotation:
    yaw-degrees: 12.0
    pitch-degrees: 1.5
    roll-degrees: 0.0

font:
  preset: "ornate-9x12"

geometry:
  pixel-width: 1
  pixel-height: 1
  depth-blocks: 5
  front-thickness-blocks: 1
  back-thickness-blocks: 1
  letter-gap-blocks: 2
  fill:
    mode: "porous"
    density: 0.75
    preserve-connectivity: true
    protect-endpoints: true
    outline-preserve-percent: 82.0
    min-retained-pixels: 14

palette:
  mode: "clustered"
  cluster-size-min: 3
  cluster-size-max: 6

  front:
    - block: "minecraft:cut_copper"
      weight: 3
    - block: "minecraft:exposed_cut_copper"
      weight: 3
    - block: "minecraft:weathered_cut_copper"
      weight: 4
    - block: "minecraft:oxidized_cut_copper"
      weight: 3
    - block: "minecraft:polished_deepslate"
      weight: 4

  side:
    - block: "minecraft:deepslate_tiles"
      weight: 5
    - block: "minecraft:deepslate_bricks"
      weight: 4
    - block: "minecraft:blackstone"
      weight: 3
    - block: "minecraft:oxidized_cut_copper"
      weight: 2

  back:
    - block: "minecraft:blackstone"
      weight: 5
    - block: "minecraft:polished_blackstone"
      weight: 4
    - block: "minecraft:deepslate_tiles"
      weight: 3

  accent:
    enabled: true
    chance-percent: 6.0
    materials:
      - block: "minecraft:shroomlight"
        weight: 1
      - block: "minecraft:ochre_froglight"
        weight: 1

  outline:
    enabled: true
    chance-percent: 92.0
    materials:
      - block: "minecraft:blackstone"
        weight: 4
      - block: "minecraft:polished_blackstone"
        weight: 4
      - block: "minecraft:deepslate_tiles"
        weight: 5

noise:
  enabled: true
  count: 4
  cluster-size-min: 1
  cluster-size-max: 2
  horizontal-padding-blocks: 4
  vertical-padding-blocks: 3
  depth-min-blocks: 4
  depth-max-blocks: 9
  materials:
    - block: "minecraft:gray_stained_glass"
      weight: 4
    - block: "minecraft:brown_stained_glass"
      weight: 2
    - block: "minecraft:black_stained_glass"
      weight: 3
