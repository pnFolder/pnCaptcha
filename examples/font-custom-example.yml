# Custom Font Example
# Пример собственного 5x7 bitmap-шрифта.
# ВАЖНО: все glyph должны иметь одинаковую ширину и высоту.
# alphabet должен содержать только символы, которые реально описаны ниже.

font:
  preset: "custom"
  alphabet: "AB23"

  custom-glyphs:
    A:
      - "01110"
      - "10001"
      - "10001"
      - "11111"
      - "10001"
      - "10001"
      - "10001"

    B:
      - "11110"
      - "10001"
      - "10001"
      - "11110"
      - "10001"
      - "10001"
      - "11110"

    '2':
      - "01110"
      - "10001"
      - "00001"
      - "00010"
      - "00100"
      - "01000"
      - "11111"

    '3':
      - "11110"
      - "00001"
      - "00001"
      - "01110"
      - "00001"
      - "00001"
      - "11110"

# Для собственного 5x7 обычно удобно увеличить bitmap-пиксель:
geometry:
  pixel-width: 2
  pixel-height: 2
  depth-blocks: 3
  fill:
    mode: "solid"
    density: 1.0
    preserve-connectivity: true
    protect-endpoints: true
    outline-preserve-percent: 100.0
    min-retained-pixels: 10
