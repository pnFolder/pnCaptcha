# Hard but Readable
# Более сложный визуал: меньше плотность, чуть больше повороты и noise,
# но без сильного позиционного хаоса, чтобы человек всё ещё мог прочитать код.

general:
  captcha-length: 6
  max-attempts: 3
  timeout-seconds: 28

scene:
  distance-blocks: 46.0
  center-height-blocks: 7.0
  rotation:
    yaw-degrees: 13.0
    pitch-degrees: 2.0
    roll-degrees: 1.5

font:
  preset: "ornate-9x12"

geometry:
  pixel-width: 1
  pixel-height: 1
  depth-blocks: 5
  letter-gap-blocks: 3
  fill:
    mode: "porous"
    density: 0.66
    preserve-connectivity: true
    protect-endpoints: true
    outline-preserve-percent: 86.0
    min-retained-pixels: 14

randomness:
  enabled: true
  character:
    horizontal-jitter-blocks: 0
    vertical-jitter-blocks: 1
    depth-jitter-blocks: 1
    depth-variation-blocks: 1
    rotation-yaw-jitter-degrees: 3.5
    rotation-pitch-jitter-degrees: 2.0
    rotation-roll-jitter-degrees: 1.5
  scene:
    distance-jitter-blocks: 2.0
    height-jitter-blocks: 1.0
    lateral-jitter-blocks: 1.5
    forward-yaw-jitter-degrees: 2.0
    rotation-yaw-jitter-degrees: 3.0
    rotation-pitch-jitter-degrees: 1.5
    rotation-roll-jitter-degrees: 1.0

palette:
  mode: "clustered"
  cluster-size-min: 1
  cluster-size-max: 4

noise:
  enabled: true
  count: 14
  cluster-size-min: 1
  cluster-size-max: 3
  horizontal-padding-blocks: 6
  vertical-padding-blocks: 5
  depth-min-blocks: 2
  depth-max-blocks: 9
  materials:
    - block: "minecraft:gray_stained_glass"
      weight: 5
    - block: "minecraft:cyan_stained_glass"
      weight: 3
    - block: "minecraft:blue_stained_glass"
      weight: 3
    - block: "minecraft:black_stained_glass"
      weight: 2
